[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erd-editor"
version = "0.1.0"
description = "ER-Diagramm-Editor für MySQL, PostgreSQL und SQL Server"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["erd_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
erd_editor = ["resources/icons/*.svg"]
